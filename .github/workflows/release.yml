# Publishes @balacode/mental when a GitHub Release is published, or via
# workflow_dispatch (republish HEAD when the matching git tag already exists).
# Auth: secrets.NPM_TOKEN → NODE_AUTH_TOKEN. setup-node registry-url writes .npmrc.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@balacode"

      - run: npm ci

      - run: npm test

      - name: Check package version matches tag
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          test "$TAG" = "v$PKG"

      - name: Check git tag exists for this version
        if: github.event_name == 'workflow_dispatch'
        run: |
          PKG=$(node -p "require('./package.json').version")
          git fetch --tags origin
          git rev-parse --verify "refs/tags/v${PKG}"

      - name: Check product versions lockstep
        run: node scripts/bump-version.mjs --check

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already on npm — skip"
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --access public --tag beta
          else
            npm publish --access public
          fi
