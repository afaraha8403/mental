# Publishes @balacode/mental when a GitHub Release is published.
# OIDC trusted publishing (`id-token: write`). No NPM_TOKEN.
# Do NOT set setup-node `registry-url` — it writes `_authToken=${NODE_AUTH_TOKEN}`
# into .npmrc and npm skips OIDC (ENEEDAUTH / E404). See npm/cli#8730.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npm test

      - name: Check package version matches tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          test "$TAG" = "v$PKG"

      - name: Publish to npm
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} already on npm — skip"
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then
            npm publish --access public --tag beta
          else
            npm publish --access public
          fi
